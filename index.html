<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apple Sale">
    <meta name="theme-color" content="#000000">
    <title>Трекер</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface2: #2c2c2e;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --sub: #98989d;
            --blue: #0a84ff;
            --blue-glow: rgba(10, 132, 255, 0.3);
            --green: #34c759;
            --orange: #ff9f0a;
            --red: #ff453a;
            --purple: #bf5af2;
            --radius: 16px;
            --radius-sm: 12px;
            --nav-h: 80px;
            --safe-top: env(safe-area-inset-top, 47px);
            --safe-bottom: env(safe-area-inset-bottom, 34px);
            --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.02em;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
            max-width: 430px;
            position: relative;
            min-height: 100vh;
            padding-top: calc(var(--safe-top) + 12px);
        }

        /* ========== LOCK SCREEN ========== */
        .lock {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .lock.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .lock-icon {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: rgba(10, 132, 255, 0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--blue);
            margin-bottom: 28px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .lock-icon:active { transform: scale(0.93); }
        .lock-input {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff; font-size: 18px;
            padding: 12px 16px; text-align: center;
            width: 140px; letter-spacing: 6px;
            outline: none; margin-bottom: 10px;
        }
        .lock-input:focus { border-color: var(--blue); }
        .lock-sub { color: var(--sub); font-size: 13px; }

        /* ========== PAGES ========== */
        .page { display: none; padding: 0 16px calc(var(--nav-h) + var(--safe-bottom) + 20px); animation: fade 0.25s ease; }
        .page.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* ========== BOTTOM NAV ========== */
        .nav {
            position: fixed; bottom: 0;
            left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 430px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px);
            border-top: 0.5px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 8px 0 var(--safe-bottom); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            font-size: 10px; font-weight: 500; color: var(--sub);
            cursor: pointer; padding: 6px 12px; border-radius: 10px;
            border: none; background: none; font-family: var(--font);
            transition: 0.2s;
        }
        .nav-item.active { color: var(--blue); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; }
        .nav-item.active svg { stroke: var(--blue); }

        /* ========== CARDS ========== */
        .card {
            background: rgba(28, 28, 30, 0.82);
            backdrop-filter: blur(60px) saturate(180%);
            -webkit-backdrop-filter: blur(60px) saturate(180%);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
        }

        /* ========== GOAL ========== */
        .goal-row { display: flex; gap: 14px; align-items: center; }
        .goal-img {
            width: 64px; height: 64px; border-radius: 14px;
            object-fit: cover; background: var(--surface2);
            border: 0.5px solid var(--border); flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .goal-placeholder {
            width: 64px; height: 64px; border-radius: 14px;
            background: linear-gradient(135deg, #1c1c1f, #26262a);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; flex-shrink: 0; color: #555;
        }
        .goal-info { flex: 1; min-width: 0; }
        .goal-name { font-size: 16px; font-weight: 590; letter-spacing: -0.01em; }
        .goal-price { font-size: 20px; font-weight: 640; color: var(--green); margin: 2px 0; letter-spacing: -0.3px; }
        .progress-bar {
            height: 5px; background: rgba(120, 120, 128, 0.2);
            border-radius: 2.5px; margin: 8px 0 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #30d158, #34c759);
            border-radius: 2.5px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .deadline {
            background: rgba(255, 159, 10, 0.06);
            border: 0.5px solid rgba(255, 159, 10, 0.2);
            border-radius: var(--radius-sm); padding: 10px 14px;
            margin-top: 10px; display: flex; align-items: center; gap: 10px;
            font-size: 13px;
        }
        .deadline b { color: var(--orange); }

        /* ========== STATS ========== */
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .stat {
            background: rgba(44, 44, 46, 0.5);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px 10px; text-align: center;
            cursor: pointer; transition: 0.2s;
        }
        .stat:active { background: rgba(255,255,255,0.04); }
        .stat-val { font-size: 17px; font-weight: 640; letter-spacing: -0.2px; }
        .stat-val.g { color: var(--green); } .stat-val.b { color: var(--blue); } .stat-val.o { color: var(--orange); }
        .stat-lbl { font-size: 11px; color: var(--sub); margin-top: 3px; letter-spacing: -0.01em; }

        /* ========== ALERTS ========== */
        .alert {
            background: rgba(255, 69, 58, 0.06);
            border: 0.5px solid rgba(255, 69, 58, 0.2);
            border-radius: var(--radius-sm); padding: 12px 14px;
            margin-bottom: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(20px);
        }
        .alert.warn { background: rgba(255, 159, 10, 0.06); border-color: rgba(255, 159, 10, 0.2); }

        /* ========== PHONE LIST ========== */
        .phone-item {
            background: rgba(44, 44, 46, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px;
            cursor: pointer; transition: 0.15s; position: relative;
        }
        .phone-item:active { background: rgba(255,255,255,0.03); }
        .phone-dot {
            position: absolute; top: 14px; right: 14px;
            width: 8px; height: 8px; border-radius: 50%;
        }
        .phone-dot.active { background: var(--green); }
        .phone-dot.idle { background: var(--orange); }
        .phone-dot.sold { background: var(--sub); }
        .phone-model { font-weight: 590; font-size: 14px; }
        .phone-sub { font-size: 11px; color: var(--sub); margin-top: 3px; }

        /* ========== BUTTONS ========== */
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 590; cursor: pointer; letter-spacing: -0.01em;
            background: var(--blue); color: #fff;
            transition: 0.2s; margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(10, 132, 255, 0.25);
        }
        .btn:active { opacity: 0.85; transform: scale(0.98); }
        .btn-out {
            background: rgba(10, 132, 255, 0.08);
            color: var(--blue);
            border: 0.5px solid rgba(10, 132, 255, 0.25);
            box-shadow: none;
        }
        .btn-sm { width: auto; padding: 8px 14px; font-size: 12px; margin: 4px; }
        .btn-danger { background: rgba(255, 69, 58, 0.1); color: var(--red); border: 0.5px solid rgba(255, 69, 58, 0.2); box-shadow: none; }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 500; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: #1c1c1e;
            border: 0.5px solid var(--border);
            border-radius: 24px 24px 0 0; padding: 20px 18px calc(var(--safe-bottom) + 20px);
            width: 100%; max-width: 430px; max-height: 88vh;
            overflow-y: auto; transition: 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }
        .modal-overlay.active .modal { transform: translateX(-50%) translateY(0); }
        .modal-handle { width: 36px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; margin: 0 auto 16px; }
        .modal-title { font-size: 17px; font-weight: 590; text-align: center; margin-bottom: 16px; letter-spacing: -0.01em; }
        .form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--sub); margin-bottom: 4px; font-weight: 500; display: block; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.04); border: 0.5px solid var(--border);
            border-radius: 12px; color: #fff; font-size: 14px;
            outline: none; margin-bottom: 10px; font-family: var(--font);
            -webkit-appearance: none;
        }
        .form-textarea { resize: vertical; min-height: 70px; font-size: 13px; }
        .form-input:focus, .form-select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.15); }
        .form-select {
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2398989d' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");
            background-repeat: no-repeat; background-position: right 14px center;
            padding-right: 34px;
        }
        .chk-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 13px; }
        .chk-row input { width: 16px; height: 16px; accent-color: var(--blue); }

        /* ========== DESCRIPTION ========== */
        .desc-block {
            background: rgba(255,255,255,0.04); border: 0.5px solid var(--border);
            border-radius: 12px; padding: 12px; font-size: 12px;
            white-space: pre-wrap; line-height: 1.5; color: #d4d4d8;
            max-height: 180px; overflow-y: auto; margin: 8px 0;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            top: calc(var(--safe-top) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: rgba(44, 44, 46, 0.95);
            border: 0.5px solid var(--border);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 13px;
            z-index: 10000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transition: 0.35s;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(30px);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        ::-webkit-scrollbar { width: 2px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div class="lock" id="lockScreen">
        <div class="lock-icon" id="faceIdTrigger">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>
        </div>
        <input type="password" class="lock-input" id="lockInput" placeholder="····" maxlength="4" inputmode="numeric">
        <div class="lock-sub">Пароль или Face ID</div>
    </div>

    <!-- APP -->
    <div id="app">

        <!-- DASHBOARD -->
        <div class="page active" id="page-dashboard">
            <!-- Цель -->
            <div class="card">
                <div class="goal-row">
                    <img class="goal-img" id="goalImg" src="" style="display:none;">
                    <div class="goal-placeholder" id="goalPlaceholder">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="#555"/></svg>
                    </div>
                    <div class="goal-info">
                        <div class="goal-name" id="goalName">Цель</div>
                        <div class="goal-price" id="goalPrice">0 ₽</div>
                    </div>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px;">
                    <span id="capitalDisplay">0 ₽</span><span id="remainingDisplay">0 ₽</span>
                </div>
                <div class="deadline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <div><b id="requiredPerDay">0 ₽/день</b><br><span style="font-size:11px;color:var(--sub);" id="daysLeft">0 дней</span></div>
                </div>
            </div>

            <!-- Статистика -->
            <div class="stats">
                <div class="stat" id="freeCashCard"><div class="stat-val g" id="freeCash">0</div><div class="stat-lbl">Свободно</div></div>
                <div class="stat" id="workingCard"><div class="stat-val b" id="workingCash">0</div><div class="stat-lbl">В обороте</div></div>
                <div class="stat" id="lifeCard"><div class="stat-val o" id="lifeBudget">0</div><div class="stat-lbl">На жизнь</div></div>
            </div>

            <div class="alert warn" id="idleAlert" style="display:none;"><span id="idleMsg"></span></div>
            <div class="alert" id="noPhonesAlert" style="display:none;">В обороте пусто — пора купить вариант.</div>

            <button class="btn" id="goToAddPhone">Добавить телефон</button>
            <button class="btn btn-out" id="spendLifeBtn">Списать с «На жизнь»</button>
            <button class="btn btn-out" id="goToGoalSettings">Настроить цель</button>
        </div>

        <!-- PHONES -->
        <div class="page" id="page-phones">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <span style="font-weight:590;font-size:17px;">Телефоны</span>
                <span style="font-size:12px;color:var(--sub);" id="phoneCount">0 шт.</span>
            </div>
            <div id="phonesList"></div>
            <button class="btn" id="addPhoneBtn">Добавить телефон</button>
        </div>

        <!-- ANALYTICS -->
        <div class="page" id="page-analytics">
            <span style="font-weight:590;font-size:17px;display:block;margin-bottom:12px;">Аналитика</span>
            <div class="card">
                <div style="display:flex;justify-content:space-between;font-size:13px;">
                    <span>Сегодня заработано</span><b id="todayEarned" style="color:var(--green);">0 ₽</b>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px;">
                    <span>Сегодня потрачено</span><b id="todaySpent" style="color:var(--red);">0 ₽</b>
                </div>
            </div>
            <div class="card">
                <span style="font-size:13px;font-weight:500;display:block;margin-bottom:8px;">Лог операций</span>
                <div id="logList" style="max-height:280px;overflow-y:auto;font-size:11px;line-height:1.7;"></div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div class="page" id="page-settings">
            <span style="font-weight:590;font-size:17px;display:block;margin-bottom:12px;">Настройки</span>
            <button class="btn btn-out" id="editGoalBtn">Изменить цель</button>
            <button class="btn btn-out" id="transferFreeToLifeBtn">Свободные → На жизнь</button>
            <button class="btn btn-out" id="transferLifeToFreeBtn">На жизнь → Свободные</button>
            <button class="btn btn-danger" id="resetAllBtn">Сбросить все данные</button>
            <p style="color:var(--sub);font-size:11px;text-align:center;margin-top:12px;">Пароль: 2307</p>
        </div>

        <!-- NAV -->
        <nav class="nav">
            <button class="nav-item active" data-page="dashboard">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Главная
            </button>
            <button class="nav-item" data-page="phones">
                <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Телефоны
            </button>
            <button class="nav-item" data-page="analytics">
                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Аналитика
            </button>
            <button class="nav-item" data-page="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                Ещё
            </button>
        </nav>
    </div>

    <!-- MODAL: PHONE -->
    <div class="modal-overlay" id="phoneModal">
        <div class="modal">
            <div class="modal-handle"></div><div class="modal-title">Телефон</div>
            <label class="form-label">Модель</label>
            <select class="form-select" id="phoneModel">
                <option>iPhone 11</option><option>iPhone 12</option><option>iPhone 13</option><option selected>iPhone 14</option><option>iPhone 15</option><option>iPhone 16</option><option>iPhone 17</option>
            </select>
            <label class="form-label">Версия</label>
            <select class="form-select" id="phoneVersion"><option value="">—</option><option>Pro</option><option>Pro Max</option></select>
            <label class="form-label">Память</label>
            <select class="form-select" id="phoneStorage"><option>128GB</option><option>256GB</option><option>512GB</option><option>1TB</option><option>2TB</option></select>
            <label class="form-label">АКБ (%)</label>
            <input type="number" class="form-input" id="phoneBattery" value="87" min="1" max="100">
            <label class="form-label">Дефекты</label>
            <input type="text" class="form-input" id="phoneDefects" placeholder="Без дефектов">
            <label class="form-label">Комплект</label>
            <div class="chk-row"><input type="checkbox" id="chkBox"><label>Коробка</label></div>
            <div class="chk-row"><input type="checkbox" id="chkCase"><label>Чехол</label></div>
            <div class="chk-row"><input type="checkbox" id="chkGlass"><label>Защитное стекло</label></div>
            <div class="chk-row"><input type="checkbox" id="chkCable"><label>Провод зарядки</label></div>
            <div class="chk-row"><input type="checkbox" id="chkBlock"><label>Блок</label></div>
            <div class="chk-row"><input type="checkbox" id="chkReceipt"><label>Чек о покупке</label></div>
            <label class="form-label">Стоимость покупки (вложение)</label>
            <input type="number" class="form-input" id="phoneCost" placeholder="₽">
            <label class="form-label">Цена для продажи (план)</label>
            <input type="number" class="form-input" id="phoneSellPrice" placeholder="₽">
            <label class="form-label">Транспорт</label>
            <select class="form-select" id="phoneTransport">
                <option value="0">Приехали сами — 0 ₽</option>
                <option value="roma">Рома</option>
                <option value="taxi">Такси</option>
                <option value="bus">Автобус</option>
            </select>
            <input type="number" class="form-input" id="phoneTransportCost" placeholder="Сумма на проезд" value="0">
            <button class="btn" id="savePhoneBtn">Сохранить</button>
            <button class="btn btn-out" id="cancelPhoneBtn">Отмена</button>
        </div>
    </div>

    <!-- MODAL: VIEW / SELL PHONE -->
    <div class="modal-overlay" id="viewPhoneModal">
        <div class="modal">
            <div class="modal-handle"></div><div class="modal-title">Детали</div>
            <div id="viewPhoneContent"></div>
            <label class="form-label" style="margin-top:8px;">Фактическая цена продажи</label>
            <input type="number" class="form-input" id="actualSellPrice" placeholder="За сколько продал реально?">
            <label class="form-label">Доп. расходы при продаже (₽)</label>
            <input type="number" class="form-input" id="extraExpenses" placeholder="Например, доставка" value="0">
            <button class="btn" id="copyDescBtn">Копировать описание</button>
            <button class="btn" id="markSoldBtn" style="background:var(--green);">Отметить проданным</button>
            <button class="btn btn-danger" id="deletePhoneBtn">Удалить</button>
            <button class="btn btn-out" id="closeViewPhoneBtn">Закрыть</button>
        </div>
    </div>

    <!-- MODAL: GOAL -->
    <div class="modal-overlay" id="goalModal">
        <div class="modal">
            <div class="modal-handle"></div><div class="modal-title">Цель</div>
            <input type="text" class="form-input" id="goalNameInput" placeholder="Название">
            <input type="number" class="form-input" id="goalPriceInput" placeholder="Цена (₽)">
            <input type="text" class="form-input" id="goalImageInput" placeholder="Ссылка на фото">
            <button class="btn" id="saveGoalBtn">Сохранить</button>
            <button class="btn btn-out" id="cancelGoalBtn">Отмена</button>
        </div>
    </div>

    <!-- MODAL: SPEND -->
    <div class="modal-overlay" id="spendModal">
        <div class="modal">
            <div class="modal-handle"></div><div class="modal-title">Трата из «На жизнь»</div>
            <select class="form-select" id="spendCategory">
                <option>Продукты</option><option>Кайф</option><option>Сушняк</option><option>Сиги</option><option>Доп</option>
            </select>
            <input type="text" class="form-input" id="customCategory" placeholder="Своя категория" style="display:none;">
            <input type="number" class="form-input" id="spendAmount" placeholder="Сумма (₽)">
            <button class="btn" id="saveSpendBtn">Списать</button>
            <button class="btn btn-out" id="cancelSpendBtn">Отмена</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        const STORAGE = 'tracker_pro_v5';
        const PASS = '2307';
        const DEF = {
            goal: { name: 'Моя цель', price: 150000, image: '' },
            phones: [],
            capital: 20000,
            working: 0,
            freeCash: 20000,
            lifeBudget: 0,
            log: [],
            lastActivity: Date.now()
        };
        let D = JSON.parse(localStorage.getItem(STORAGE)) || JSON.parse(JSON.stringify(DEF));
        if (!D.log) D.log = [];
        if (!D.phones) D.phones = [];
        if (D.lastActivity === undefined) D.lastActivity = Date.now();

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSoftClick() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, now);
            filter.frequency.exponentialRampToValueAtTime(800, now + 0.04);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.start(now); osc.stop(now + 0.06);
        }
        function playUnlockSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            [ 
                [600, 900, 0.08, 0.15],
                [900, 1200, 0.06, 0.2]
            ].forEach(([f1, f2, g, d], i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f1, now + i * 0.06);
                osc.frequency.linearRampToValueAtTime(f2, now + i * 0.06 + 0.08);
                gain.gain.setValueAtTime(0.08, now + i * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + d);
                osc.start(now + i * 0.06);
                osc.stop(now + i * 0.06 + d);
            });
        }

        function save() { localStorage.setItem(STORAGE, JSON.stringify(D)); updateAll(); }
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
        function fmt(n) { return Math.round(n).toLocaleString('ru-RU') + ' ₽'; }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast show';
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 2200);
        }

        // Заглушка для старых вызовов expandIsland
        function expandIsland(msg) {
            toast(msg);
        }

        function daysUntilAug31() {
            const now = new Date();
            let target = new Date(now.getFullYear(), 7, 31);
            if (now > target) target.setFullYear(target.getFullYear() + 1);
            return Math.max(1, Math.ceil((target - now) / 86400000));
        }
        function requiredPerDay() {
            const rem = Math.max(0, D.goal.price - D.capital);
            return Math.ceil(rem / daysUntilAug31());
        }
        function monthlyTurnover() {
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            return D.log.filter(l => l.type === 'income' && new Date(l.date).getTime() >= monthStart)
                       .reduce((s, l) => s + l.amount, 0);
        }
        function generateDescription(phone) {
            const fullName = `${phone.model}${phone.version ? ' ' + phone.version : ''} — по срочной цене.`;
            const kit = [];
            if (phone.kit.box) kit.push('• Оригинальная коробка.');
            if (phone.kit.cable) kit.push('• Оригинальный провод.');
            if (phone.kit.glass) kit.push('• Установлено защ. стекло.');
            if (phone.kit.case) kit.push('• Чехол.');
            if (phone.kit.block) kit.push('• Блок зарядки.');
            if (phone.kit.receipt) kit.push('• Чек о покупке.');
            const defects = phone.defects && phone.defects.trim() && phone.defects !== 'Без дефектов' ? `\nДефекты: ${phone.defects}.` : '';
            const state = phone.defects && phone.defects.includes('скол') ? 'есть мелкий нюанс' : 'как новый';
            const price = phone.sellPrice ? phone.sellPrice.toLocaleString('ru-RU') + '₽' : 'Цена договорная';
            return `${fullName}\n\nАйфон ${phone.model.split(' ')[1]} ${phone.storage} акб — ${phone.battery}%\n\nСостояние телефона — ${state}. Эксплуатировали аккуратно. Ремонту не подвергался. Всегда в чехле и защитном стекле.${defects}\n\nВ КОМПЛЕКТЕ:\n${kit.join('\n') || '• Без доп. комплекта.'}\n\n${price} БЫСТРЫМ ТОРГ\nВОЗМОЖНА ДОСТАВКА🚚`;
        }

        function updateAll() {
            document.getElementById('goalName').textContent = D.goal.name;
            document.getElementById('goalPrice').textContent = fmt(D.goal.price);
            const pct = Math.min(100, (D.capital / D.goal.price) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('capitalDisplay').textContent = fmt(D.capital);
            document.getElementById('remainingDisplay').textContent = 'ост. ' + fmt(Math.max(0, D.goal.price - D.capital));
            document.getElementById('requiredPerDay').textContent = fmt(requiredPerDay());
            document.getElementById('daysLeft').textContent = 'осталось ' + daysUntilAug31() + ' дн.';
            const img = document.getElementById('goalImg');
            const ph = document.getElementById('goalPlaceholder');
            if (D.goal.image) { img.src = D.goal.image; img.style.display = 'block'; ph.style.display = 'none'; }
            else { img.style.display = 'none'; ph.style.display = 'flex'; }

            document.getElementById('freeCash').textContent = fmt(D.freeCash);
            document.getElementById('workingCash').textContent = fmt(D.working);
            document.getElementById('lifeBudget').textContent = fmt(D.lifeBudget);

            const now = Date.now();
            let idleMsg = '';
            if (D.freeCash >= 10000 && (now - D.lastActivity) > 48*3600*1000)
                idleMsg = fmt(D.freeCash) + ' лежат без дела. Пора искать вариант.';
            D.phones.filter(p => p.status === 'active').forEach(p => {
                if (p.idleStart && (now - p.idleStart) > 72*3600*1000)
                    idleMsg = p.model + ' ' + p.storage + ' висит > 3 дней без продажи.';
            });
            const ia = document.getElementById('idleAlert');
            if (idleMsg) { ia.style.display = 'flex'; document.getElementById('idleMsg').textContent = idleMsg; }
            else ia.style.display = 'none';
            document.getElementById('noPhonesAlert').style.display =
                (D.phones.filter(p => p.status === 'active').length === 0 && D.working === 0) ? 'flex' : 'none';

            document.getElementById('phoneCount').textContent = D.phones.length + ' шт.';
            const list = document.getElementById('phonesList');
            if (!D.phones.length) {
                list.innerHTML = '<div style="color:var(--sub);text-align:center;padding:24px;">Нет телефонов.<br>Добавь первый.</div>';
            } else {
                list.innerHTML = D.phones.map(p => {
                    const dot = p.status === 'sold' ? 'sold' : (p.idleStart && (now - p.idleStart) > 72*3600*1000 ? 'idle' : 'active');
                    return `<div class="phone-item" data-id="${p.id}">
                <div class="phone-dot ${dot}"></div>
                <div class="phone-model">${p.model}${p.version?' '+p.version:''} ${p.storage}</div>
                <div class="phone-sub">АКБ ${p.battery}% | Вложение ${fmt(p.cost)} | Цена ${p.sellPrice?fmt(p.sellPrice):'—'} | ${p.status==='sold'?'Продано':'В обороте'}</div>
              </div>`;
                }).join('');
                list.querySelectorAll('.phone-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const p = D.phones.find(x => x.id === el.dataset.id);
                        if (p) openViewPhone(p);
                    });
                });
            }

            const today = new Date().toDateString();
            const todayLog = D.log.filter(l => new Date(l.date).toDateString() === today);
            document.getElementById('todayEarned').textContent = fmt(todayLog.filter(l => l.type === 'income').reduce((s,l) => s + l.amount, 0));
            document.getElementById('todaySpent').textContent = fmt(todayLog.filter(l => l.type === 'expense').reduce((s,l) => s + l.amount, 0));
            document.getElementById('logList').innerHTML = D.log.slice(-35).reverse().map(l => {
                const d = new Date(l.date);
                const ds = d.toLocaleDateString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
                const sign = l.type === 'income' ? '+' : '-';
                const color = l.type === 'income' ? 'var(--green)' : 'var(--red)';
                return `<div style="margin-bottom:3px;color:${color}">${sign}${fmt(l.amount)} <span style="color:var(--sub);">${l.category||''} ${l.note||''}</span> <small>${ds}</small></div>`;
            }).join('') || '<span style="color:var(--sub);">Нет записей</span>';
        }

        function openViewPhone(phone) {
            document.getElementById('viewPhoneContent').innerHTML = `
            <p style="font-weight:590;">${phone.model}${phone.version?' '+phone.version:''} ${phone.storage}</p>
            <p style="font-size:12px;color:var(--sub);">АКБ ${phone.battery}% | Дефекты: ${phone.defects||'Нет'}</p>
            <p style="font-size:12px;color:var(--sub);">Вложение: ${fmt(phone.cost)} | План продажи: ${phone.sellPrice?fmt(phone.sellPrice):'—'}</p>
            <p style="font-size:12px;color:var(--sub);">Статус: ${phone.status==='sold'?'Продано':'В обороте'}</p>
            <div class="desc-block">${generateDescription(phone)}</div>`;
            document.getElementById('actualSellPrice').value = phone.sellPrice || '';
            document.getElementById('extraExpenses').value = '0';
            openModal('viewPhoneModal');
            document.getElementById('viewPhoneModal')._phoneId = phone.id;
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateAll();
            ['phoneModal','viewPhoneModal','goalModal','spendModal'].forEach(id => setupSwipe(id, id));

            const lock = document.getElementById('lockScreen');
            document.getElementById('faceIdTrigger').addEventListener('click', () => {
                initAudio(); playUnlockSound();
                lock.classList.add('hidden');
                toast('Доступ разрешён');
                expandIsland('Добро пожаловать');
            });
            document.getElementById('lockInput').addEventListener('input', function() {
                if (this.value === PASS) {
                    initAudio(); playUnlockSound();
                    lock.classList.add('hidden');
                    toast('Доступ разрешён');
                    expandIsland('Доступ разрешён');
                }
            });

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    initAudio(); playSoftClick();
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    document.getElementById('page-' + btn.dataset.page).classList.add('active');
                    updateAll();
                });
            });

            document.getElementById('goToAddPhone')?.addEventListener('click', () => {
                document.querySelector('.nav-item[data-page="phones"]').click();
                setTimeout(() => openModal('phoneModal'), 200);
            });
            document.getElementById('addPhoneBtn')?.addEventListener('click', () => openModal('phoneModal'));
            document.getElementById('goToGoalSettings')?.addEventListener('click', () => {
                document.getElementById('goalNameInput').value = D.goal.name;
                document.getElementById('goalPriceInput').value = D.goal.price;
                document.getElementById('goalImageInput').value = D.goal.image;
                openModal('goalModal');
            });
            document.getElementById('editGoalBtn')?.addEventListener('click', () => {
                document.getElementById('goalNameInput').value = D.goal.name;
                document.getElementById('goalPriceInput').value = D.goal.price;
                document.getElementById('goalImageInput').value = D.goal.image;
                openModal('goalModal');
            });

            document.getElementById('savePhoneBtn').addEventListener('click', () => {
                initAudio();
                const phone = {
                    id: uid(),
                    model: document.getElementById('phoneModel').value,
                    version: document.getElementById('phoneVersion').value,
                    storage: document.getElementById('phoneStorage').value,
                    battery: parseInt(document.getElementById('phoneBattery').value) || 87,
                    defects: document.getElementById('phoneDefects').value || 'Без дефектов',
                    kit: {
                        box: document.getElementById('chkBox').checked,
                        case: document.getElementById('chkCase').checked,
                        glass: document.getElementById('chkGlass').checked,
                        cable: document.getElementById('chkCable').checked,
                        block: document.getElementById('chkBlock').checked,
                        receipt: document.getElementById('chkReceipt').checked
                    },
                    cost: parseInt(document.getElementById('phoneCost').value) || 0,
                    sellPrice: parseInt(document.getElementById('phoneSellPrice').value) || 0,
                    transportType: document.getElementById('phoneTransport').value,
                    transportCost: parseInt(document.getElementById('phoneTransportCost').value) || 0,
                    status: 'active',
                    dateAdded: new Date().toISOString(),
                    dateSold: null,
                    idleStart: Date.now()
                };
                if (phone.cost <= 0) { toast('Укажи стоимость вложения'); return; }
                if (phone.cost > D.freeCash) { toast('Недостаточно свободных денег'); return; }
                D.freeCash -= phone.cost;
                D.working += phone.cost;
                if (phone.transportCost > 0) {
                    D.lifeBudget = Math.max(0, D.lifeBudget - phone.transportCost);
                    D.log.push({ date: new Date().toISOString(), type: 'expense', amount: phone.transportCost, category: 'Транспорт', note: 'Покупка' });
                }
                D.phones.push(phone);
                D.log.push({ date: new Date().toISOString(), type: 'purchase', amount: phone.cost, category: 'Телефон', note: phone.model + ' ' + phone.storage });
                D.lastActivity = Date.now();
                save(); closeModal('phoneModal');
                toast('Телефон добавлен');
                expandIsland('Добавлен ' + phone.model);
            });
            document.getElementById('cancelPhoneBtn').addEventListener('click', () => closeModal('phoneModal'));

            document.getElementById('markSoldBtn').addEventListener('click', () => {
                initAudio();
                const id = document.getElementById('viewPhoneModal')._phoneId;
                const phone = D.phones.find(p => p.id === id);
                if (!phone || phone.status !== 'active') return;
                const actualPrice = parseInt(document.getElementById('actualSellPrice').value) || phone.sellPrice || phone.cost;
                const extra = parseInt(document.getElementById('extraExpenses').value) || 0;
                const profit = actualPrice - phone.cost - extra;
                const half = Math.round(profit * 0.5);
                D.capital += half;
                D.lifeBudget += half;
                D.working = Math.max(0, D.working - phone.cost);
                D.freeCash += actualPrice;
                if (extra > 0) {
                    D.lifeBudget = Math.max(0, D.lifeBudget - extra);
                    D.log.push({ date: new Date().toISOString(), type: 'expense', amount: extra, category: 'Доп.расходы', note: 'Продажа ' + phone.model });
                }
                phone.status = 'sold'; phone.sellPrice = actualPrice; phone.dateSold = new Date().toISOString();
                D.lastActivity = Date.now();
                D.log.push({ date: new Date().toISOString(), type: 'income', amount: profit, category: 'Продажа', note: phone.model + ' +' + fmt(half) });
                save();
                toast('Продано! +' + fmt(half));
                expandIsland('Продано! +' + fmt(half));
                closeModal('viewPhoneModal');
            });
            document.getElementById('deletePhoneBtn').addEventListener('click', () => {
                initAudio();
                const id = document.getElementById('viewPhoneModal')._phoneId;
                D.phones = D.phones.filter(p => p.id !== id);
                save(); closeModal('viewPhoneModal'); toast('Телефон удалён');
            });
            document.getElementById('copyDescBtn').addEventListener('click', () => {
                initAudio();
                const txt = document.querySelector('#viewPhoneContent .desc-block')?.textContent || '';
                navigator.clipboard.writeText(txt).then(() => toast('Описание скопировано'));
            });
            document.getElementById('closeViewPhoneBtn').addEventListener('click', () => closeModal('viewPhoneModal'));

            document.getElementById('saveGoalBtn').addEventListener('click', () => {
                initAudio();
                D.goal.name = document.getElementById('goalNameInput').value.trim() || 'Цель';
                D.goal.price = parseInt(document.getElementById('goalPriceInput').value) || 150000;
                D.goal.image = document.getElementById('goalImageInput').value.trim();
                save(); closeModal('goalModal');
                toast('Цель обновлена');
                expandIsland('Цель: ' + D.goal.name);
            });
            document.getElementById('cancelGoalBtn').addEventListener('click', () => closeModal('goalModal'));

            document.getElementById('spendLifeBtn')?.addEventListener('click', () => openModal('spendModal'));
            document.getElementById('lifeCard')?.addEventListener('click', () => openModal('spendModal'));
            document.getElementById('spendCategory').addEventListener('change', function() {
                document.getElementById('customCategory').style.display = this.value === 'Доп' ? 'block' : 'none';
            });
            document.getElementById('saveSpendBtn').addEventListener('click', () => {
                initAudio();
                const cat = document.getElementById('spendCategory').value;
                const custom = document.getElementById('customCategory').value.trim();
                const amount = parseInt(document.getElementById('spendAmount').value) || 0;
                const category = cat === 'Доп' && custom ? custom : cat;
                if (amount <= 0 || amount > D.lifeBudget) { toast('Недостаточно бюджета'); return; }
                D.lifeBudget -= amount;
                D.log.push({ date: new Date().toISOString(), type: 'expense', amount, category, note: '' });
                save(); closeModal('spendModal'); toast('Списано ' + fmt(amount));
            });
            document.getElementById('cancelSpendBtn').addEventListener('click', () => closeModal('spendModal'));

            document.getElementById('transferFreeToLifeBtn')?.addEventListener('click', () => {
                initAudio();
                const amt = parseInt(prompt('Сумма из Свободных в На жизнь?', D.freeCash)) || 0;
                if (amt > 0 && amt <= D.freeCash) {
                    D.freeCash -= amt; D.lifeBudget += amt;
                    D.log.push({ date: new Date().toISOString(), type: 'transfer', amount: amt, category: 'Свободные → На жизнь', note: '' });
                    save(); toast('Переведено ' + fmt(amt));
                } else toast('Неверная сумма');
            });
            document.getElementById('transferLifeToFreeBtn')?.addEventListener('click', () => {
                initAudio();
                const amt = parseInt(prompt('Сумма из На жизнь в Свободные?', D.lifeBudget)) || 0;
                if (amt > 0 && amt <= D.lifeBudget) {
                    D.lifeBudget -= amt; D.freeCash += amt;
                    D.log.push({ date: new Date().toISOString(), type: 'transfer', amount: amt, category: 'На жизнь → Свободные', note: '' });
                    save(); toast('Переведено ' + fmt(amt));
                } else toast('Неверная сумма');
            });

            document.getElementById('resetAllBtn')?.addEventListener('click', () => {
                initAudio();
                if (confirm('Удалить все данные?')) {
                    localStorage.removeItem(STORAGE); D = JSON.parse(JSON.stringify(DEF)); save(); toast('Сброшено');
                }
            });

            document.querySelectorAll('.modal-overlay').forEach(ov => {
                ov.addEventListener('click', function(e) { if (e.target === this) closeModal(this.id); });
            });

            setInterval(updateAll, 60000);
        });
    </script>
</body>
</html>
